[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
    "B",
    "BLE",
    "DTZ",
    "ISC",
]

[tool.ruff.lint.per-file-ignores]
# The MVP uses local calendar dates for forecast targets.
"src/data_layer/weather.py" = ["DTZ011"]

# The treatment-date bounds mirror the horizon check in weather.py, which
# compares against the local calendar date. Both must use the same clock.
"app.py" = ["DTZ011"]

"src/workflow/graph.py" = [
    # Graph nodes intentionally catch unexpected integration and model
    # errors so the workflow can enter its controlled failure route.
    "BLE001",

    # The MVP currently uses local calendar dates rather than timezone-aware
    # datetimes. Revisit this when deploying the weather integration.
    "DTZ011",
]

[tool.mypy]
mypy_path = "src"
files = ["src"]
pretty = true
show_error_codes = true
